[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vexdb-active-memory"
version = "0.1.0"
description = "Database-native active memory framework for VexDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "VexDB Active Memory" }]
dependencies = [
  "httpx>=0.27",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
vexdb-memory = "vexdb_active_memory.cli:main"
vexdb-memory-mcp = "vexdb_active_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["python/vexdb_active_memory"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
